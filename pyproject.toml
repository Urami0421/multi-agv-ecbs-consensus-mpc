[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agv-planning"
version = "0.2.0"
description = "Multi-AGV Space-Time Planning (ECBS), Safe-Corridor B-Spline, and CBF-MPC Control"
authors = [{name = "Urami0421"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "osqp>=0.6.2",
    "pyyaml>=6.0",
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6", "pyvista>=0.40", "pyvistaqt>=0.10", "imageio>=2.20", "pillow>=9.0"]
sim = ["gymnasium>=0.28", "numba>=0.57"]
rrt = ["rtree>=1.0"]
dev = ["pytest>=7.0", "ruff>=0.4"]
all = ["multi-agv-planning[viz,sim,rrt,dev]"]

[project.urls]
Repository = "https://github.com/Urami0421/multi-agv-ecbs-consensus-mpc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 110
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
